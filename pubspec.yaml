name: mon_premier_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.1
  image_picker: ^1.0.4
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^7.2.2
  path_provider: ^2.1.2
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.2.5
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1   # 👈 AJOUTÉ

flutter_launcher_icons:              # 👈 AJOUTÉ
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#8D6E63"
  adaptive_icon_foreground: "assets/icon/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png